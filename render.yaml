services:
  - type: web
    name: evo-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: PORT
        value: 5000
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        sync: false
